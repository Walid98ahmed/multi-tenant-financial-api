services:
  db:
    image: postgres:16-alpine
    container_name: ledgers_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgers_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ledgers_api
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - '3000:3000'
    command: sh -c "npm run migration:run && npm run seed && npm run start:prod"

volumes:
  postgres_data:
